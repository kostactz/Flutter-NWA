<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWA Bridge Debugger</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 { font-size: 1.5rem; color: #4a148c; }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #6200ee;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        button.secondary { background-color: #03dab5; color: #000; }
        
        .input-group {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #log {
            background: #263238;
            color: #80cbc4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .status {
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .status.online { color: green; }
        .status.offline { color: red; }
    </style>
</head>
<body>

    <h1>AWA Bridge Debugger</h1>
    
    <div id="connectionStatus" class="status">Checking connection...</div>

    <div class="card">
        <h3>Location & Media</h3>
        <div class="button-grid">
            <button onclick="handleAction('getLocation')">Get Location</button>
            <button onclick="handleAction('takePhoto')">Take Photo</button>
            <button onclick="handleAction('pickFile')">Pick File</button>
        </div>
    </div>

    <div class="card">
        <h3>SMS Integration</h3>
        <div class="input-group">
            <input type="text" id="smsNumber" placeholder="Phone Number (e.g. +1234567)">
            <input type="text" id="smsText" placeholder="Message Body">
            <button class="secondary" onclick="handleSendSms()">Send SMS</button>
        </div>
        <div style="margin-top: 15px;">
            <button class="secondary" style="width: 100%;" onclick="handleAction('receiveSms')">Listen for SMS (Android OTP)</button>
        </div>
    </div>

    <div class="card">
        <h3>Bridge Logs</h3>
        <div id="log">Ready for commands...</div>
        <button style="margin-top:10px; background:#555; width:100%" onclick="clearLogs()">Clear Logs</button>
    </div>

    <script>
        // Inline AWABridge for zero-dependency debugging
        const AWABridge = {
            call: async function(method, params = {}) {
                const requestId = crypto.randomUUID();
                
                if (!window.flutter_inappwebview) {
                    log(`[WARN] Native bridge not found. Using fallback for ${method}.`, 'orange');
                    return this._mockFallback(method);
                }

                const requestPayload = { id: requestId, method, params };
                log(`[OUT] ${method}: ${JSON.stringify(params)}`, '#81d4fa');
                
                try {
                    const response = await window.flutter_inappwebview.callHandler('AWABridge', requestPayload);
                    if (response.error) {
                        log(`[ERR] ${method}: ${JSON.stringify(response.error)}`, '#ff8a80');
                        throw response.error;
                    }
                    log(`[IN] ${method}: ${JSON.stringify(response.data)}`, '#c5e1a5');
                    return response.data;
                } catch (err) {
                    log(`[FAIL] ${method}: ${err.message || err}`, '#ff5252');
                    throw err;
                }
            },

            _mockFallback: function(method) {
                if (method === 'location.current') {
                    return new Promise((res) => res({ latitude: 0, longitude: 0, accuracy: 0 }));
                }
                return null;
            }
        };

        // UI Handlers
        async function handleAction(method) {
            try {
                await AWABridge.call(method === 'getLocation' ? 'location.current' : 
                                   method === 'takePhoto' ? 'media.camera' : 
                                   method === 'pickFile' ? 'media.filePicker' : 'sms.receive');
            } catch (e) {}
        }

        async function handleSendSms() {
            const number = document.getElementById('smsNumber').value;
            const payload = document.getElementById('smsText').value;
            try {
                await AWABridge.call('sms.send', { number, payload });
            } catch (e) {}
        }

        // Logger Utilities
        function log(msg, color = '#80cbc4') {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logEl.innerHTML = `<span style="color:gray">[${time}]</span> <span style="color:${color}">${msg}</span>\n` + logEl.innerHTML;
        }

        function clearLogs() {
            document.getElementById('log').innerHTML = 'Logs cleared...';
        }

        // Connection Check
        function checkConnection() {
            const statusEl = document.getElementById('connectionStatus');
            if (window.flutter_inappwebview) {
                statusEl.innerText = "● Shell Connected: AWA Native Features Enabled";
                statusEl.className = "status online";
            } else {
                statusEl.innerText = "○ Shell Not Detected: Running in Standard Browser";
                statusEl.className = "status offline";
            }
        }

        // Initialize
        window.addEventListener("flutterInAppWebViewPlatformReady", function(event) {
            checkConnection();
            log("[SYSTEM] AWA Platform Ready Event Received", "#ffeb3b");
        });

        // Periodic check in case event is missed
        setInterval(checkConnection, 2000);
        checkConnection();
    </script>
</body>
</html>
